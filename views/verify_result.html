<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Token - TurboStack</title>
    <style>
        /* --- Reset & Variables --- */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --radius: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        .card-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .details-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1rem;
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .detail-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .detail-value {
            color: var(--text-main);
            font-weight: 600;
        }

        .badge {
            background-color: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .back-link {
            display: block;
            margin-top: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .back-link:hover {
            color: #a5b4fc;
        }
    </style>
</head>

<body>

    <main class="card">
        <header class="card-header">
            <h1>Jeton Vérifié</h1>
            <p>Détails des réclamations (claims) du jeton</p>
        </header>

        <div class="details-list">
            <div class="detail-item">
                <span class="detail-label">Nom complet</span>
                <span class="detail-value">{{ .full_name }}</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Email</span>
                <span class="detail-value">{{ .email }}</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Abonnement</span>
                <span class="badge">{{ .subscription }}</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Durée</span>
                <span class="detail-value">{{ .number_of_day }} jour(s)</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Émis le (iat)</span>
                <span class="detail-value">{{ .iat }}</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Expire le (exp)</span>
                <span class="detail-value">{{ .exp }}</span>
            </div>
        </div>

        <a href="/verify" class="back-link">&#8592; Vérifier un autre jeton</a>
    </main>

</body>

</html>

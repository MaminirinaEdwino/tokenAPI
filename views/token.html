<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Généré - TurboStack</title>
    <style>
        /* --- Reset & Variables --- */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --radius: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* --- Carte principale --- */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        /* --- Bouton retour --- */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--text-main);
            transform: translateX(-3px);
        }

        /* --- En-tête --- */
        .card-header {
            margin-bottom: 1.75rem;
        }

        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        .card-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* --- Grille des informations --- */
        .details-grid {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin-bottom: 1.75rem;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .detail-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .detail-value {
            color: var(--text-main);
            font-weight: 600;
        }

        .badge {
            background-color: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        /* --- Section Jeton (Token) --- */
        .token-container {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .token-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .token-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 700;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            transition: var(--transition);
        }

        .copy-btn:hover {
            background-color: rgba(99, 102, 241, 0.1);
        }

        .token-value {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.9rem;
            color: var(--success-color);
            word-break: break-all;
            line-height: 1.4;
            user-select: all;
            background: var(--success-bg);
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
    </style>
</head>

<body>

    <main class="card">
        <!-- Lien Retour -->
        <a href="/token" class="back-link">
            &#8592; Générer un autre jeton
        </a>

        <!-- En-tête -->
        <header class="card-header">
            <h1>Jeton Généré</h1>
            <p>Voici les détails et la clé d'accès attribuée.</p>
        </header>

        <!-- Liste des détails -->
        <div class="details-grid">
            <div class="detail-item">
                <span class="detail-label">Nom complet</span>
                <span class="detail-value">{{ .Full_name }}</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Email</span>
                <span class="detail-value">{{ .Email }}</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Durée de validité</span>
                <span class="detail-value">{{ .Number_of_day }} jour(s)</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Abonnement</span>
                <span class="badge">{{ .Subscription }}</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Date d'expiration</span>
                <span class="detail-value">{{ .ExpDate }}</span>
            </div>
        </div>

        <!-- Zone du jeton / Token -->
        <div class="token-container">
            <div class="token-header">
                <span class="token-title">Token d'accès</span>
                <button class="copy-btn" onclick="copyToken()">Copier</button>
            </div>
            <div class="token-value" id="tokenText">{{ .Token }}</div>
        </div>
    </main>

    <script>
        function copyToken() {
            const tokenText = document.getElementById('tokenText').innerText;
            navigator.clipboard.writeText(tokenText).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerText = 'Copié !';
                btn.style.color = '#10b981';
                setTimeout(() => {
                    btn.innerText = 'Copier';
                    btn.style.color = '';
                }, 2000);
            });
        }
    </script>
</body>

</html>

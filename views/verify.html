<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérifier un Token - TurboStack</title>
    <style>
        /* --- Reset & Variables --- */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --focus-ring: rgba(99, 102, 241, 0.35);
            --radius: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* --- Carte principale --- */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        /* --- En-tête --- */
        .card-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .card-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* --- Formulaire --- */
        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
        }

        /* Textarea pour le Token */
        textarea {
            width: 100%;
            height: 130px;
            padding: 0.85rem 1rem;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.875rem;
            line-height: 1.4;
            outline: none;
            resize: vertical;
            transition: var(--transition);
        }

        textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px var(--focus-ring);
            background-color: rgba(15, 23, 42, 0.9);
        }

        textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Bouton de validation */
        input[type="submit"] {
            margin-top: 0.5rem;
            padding: 0.85rem;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        input[type="submit"]:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        input[type="submit"]:active {
            transform: translateY(0);
        }

        /* Pied de carte / Lien */
        .card-footer {
            margin-top: 1.5rem;
            text-align: center;
        }

        .card-footer a {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            transition: var(--transition);
        }

        .card-footer a:hover {
            color: #a5b4fc;
        }
    </style>
</head>

<body>

    <main class="card">
        <header class="card-header">
            <h1>Vérifier un Token</h1>
            <p>Collez votre jeton ci-dessous pour tester sa validité.</p>
        </header>

        <form action="/verify-form" method="post">
            <div class="form-group">
                <label for="token">Jeton d'accès (Token)</label>
                <textarea name="token" id="token" placeholder="Collez votre clé ou jeton ici..." required></textarea>
            </div>

            <input type="submit" value="Vérifier le jeton">
        </form>

        <footer class="card-footer">
            <a href="/token">Besoin de générer un nouveau jeton ?</a>
        </footer>
    </main>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate token</title>
</head>

<body>
    <h1>TurboStack Tokenizer</h1>
    <form action="/token" method="post">
        <div>
            <label for="">Full Name</label>
            <input type="text" name="full_name" id="full_name">
        </div>
        <div>
            <label for="">Email</label>
            <input type="text" name="email" id="email">
        </div>
        <div>
            <label for="">Number of Day</label>
            <input type="number" name="number_of_day" id="number_of_day">
        </div>
        <div>
            <label for="">Payment Ref</label>
            <input type="text" name="payment_ref" id="payment_ref">
        </div>
        <div>
            <label for="">Subscription</label>
            <input type="text" name="subscription" id="subscription">
        </div>
        <input type="submit" value="Send">
    </form>
</body>


</html>
